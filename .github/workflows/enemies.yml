# Refresh the sample enemies (current Anomaly Arbitration bosses) from the wiki every week.
name: Update enemy presets
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 scripts/build_enemies.py
      - name: Commit if changed
        run: |
          if git diff --quiet data/enemy-presets.js; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/enemy-presets.js
          git commit -m "Update enemy presets to the current Anomaly Arbitration cycle"
          git push
